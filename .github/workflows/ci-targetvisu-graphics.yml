name: TargetVisu graphics and backgrounds
on:
  pull_request:
    branches:
      - feature/number-touch-keypad
      - feature/transparent-button-number
      - feature/screen-background-image
      - feature/graphic-view-image-states
      - feature/number-dynamic-colors
      - main
    paths:
      - 'src/middleware/shared/targetvisu/**'
      - 'src/frontend/components/_features/[workspace]/editor/targetvisu/**'
      - 'src/backend/shared/compile/steps/**'
      - '.github/workflows/ci-targetvisu-graphics.yml'
jobs:
  graphic-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:strucpp
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: TargetVisu regression tests
        run: |
          npx jest --runInBand --no-coverage --runTestsByPath \
            'src/frontend/components/_features/[workspace]/editor/targetvisu/__tests__/designer.test.tsx' \
            'src/frontend/components/_features/[workspace]/editor/targetvisu/__tests__/number-keypad.test.ts' \
            'src/frontend/components/_features/[workspace]/editor/targetvisu/__tests__/graphic-properties.test.tsx' \
            'src/middleware/shared/targetvisu/__tests__/graphics.test.ts' \
            'src/middleware/shared/targetvisu/__tests__/lamp-palette.test.ts' \
            'src/middleware/shared/targetvisu/__tests__/model.test.ts' \
            'src/backend/shared/compile/steps/__tests__/generate-targetvisu.test.ts'
